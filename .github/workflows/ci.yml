name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Install command router
        run: brew install just
      - name: Verify repository contract
        run: just ci

  macos14-behavior:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Install command router
        run: brew install just
      - name: Verify LineBased integer-field reversal
        run: just macos14-behavior
      - name: Run hosted release regression benchmark
        run: just benchmark-ci

  ci-gate:
    if: always()
    needs: [verify, macos14-behavior]
    runs-on: ubuntu-latest
    steps:
      - name: Require verification success or intentional draft skip
        shell: bash
        run: |
          case "${{ needs.verify.result }}:${{ needs.macos14-behavior.result }}" in
            success:success|skipped:skipped) exit 0 ;;
            *) exit 1 ;;
          esac
